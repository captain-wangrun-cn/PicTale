<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63758c"/>
      <stop offset="0.34" stop-color="#9c8b92"/>
      <stop offset="0.56" stop-color="#dba077"/>
      <stop offset="0.72" stop-color="#f0c391"/>
      <stop offset="1" stop-color="#f7dbb0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff0c8" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#ffdfa4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffdfa4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="train" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7bdc2"/>
      <stop offset="0.45" stop-color="#929aa1"/>
      <stop offset="1" stop-color="#5f686f"/>
    </linearGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46464b"/>
      <stop offset="1" stop-color="#2c2c30"/>
    </linearGradient>
    <filter id="blur16"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="blur5"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#dawn)"/>

  <!-- 太阳与飞鸟 -->
  <ellipse cx="250" cy="366" rx="220" ry="180" fill="url(#sunGlow)"/>
  <circle cx="250" cy="366" r="52" fill="#ffe9bd"/>
  <g stroke="#4a4a52" stroke-width="2.5" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M430 246 q10 -8 20 0 q10 -8 20 0"/>
    <path d="M492 212 q8 -7 16 0 q8 -7 16 0"/>
    <path d="M540 268 q6 -5 12 0 q6 -5 12 0"/>
  </g>

  <!-- 远处城市 -->
  <g fill="#8d7d7d" opacity="0.5">
    <rect x="0" y="452" width="70" height="76"/>
    <rect x="64" y="470" width="46" height="58"/>
    <rect x="104" y="430" width="34" height="98"/>
    <rect x="146" y="482" width="80" height="46"/>
    <rect x="232" y="462" width="44" height="66"/>
    <rect x="286" y="474" width="96" height="54"/>
    <rect x="372" y="486" width="60" height="42"/>
  </g>
  <rect x="0" y="470" width="520" height="60" fill="#f2cf9f" opacity="0.35" filter="url(#blur16)"/>

  <!-- 列车 -->
  <g>
    <rect x="600" y="262" width="620" height="300" fill="#000" opacity="0.25" filter="url(#blur16)"/>
    <path d="M600 288 q0 -24 24 -24 h576 a20 20 0 0 1 20 20 v244 h-620 z" fill="url(#train)"/>
    <rect x="600" y="264" width="620" height="16" fill="#c9ced2" opacity="0.8"/>
    <rect x="600" y="470" width="620" height="28" fill="#4c545a"/>
    <path d="M600 288 q0 -24 24 -24 h10 v264 h-34 z" fill="#7b838a"/>
    <g>
      <rect x="648" y="318" width="96" height="62" rx="4" fill="#f7dca6"/>
      <rect x="764" y="318" width="96" height="62" rx="4" fill="#f2d39a" opacity="0.9"/>
      <rect x="880" y="318" width="96" height="62" rx="4" fill="#e8c78c" opacity="0.75"/>
      <rect x="996" y="318" width="96" height="62" rx="4" fill="#f7dca6" opacity="0.85"/>
      <rect x="1112" y="318" width="96" height="62" rx="4" fill="#eccb92" opacity="0.6"/>
    </g>
    <g stroke="#6f777d" stroke-width="2" opacity="0.7">
      <line x1="744" y1="300" x2="744" y2="470"/>
      <line x1="860" y1="300" x2="860" y2="470"/>
      <line x1="976" y1="300" x2="976" y2="470"/>
      <line x1="1092" y1="300" x2="1092" y2="470"/>
    </g>
    <rect x="612" y="404" width="24" height="16" rx="6" fill="#ffe3ac"/>
    <rect x="612" y="436" width="24" height="16" rx="6" fill="#ffe3ac" opacity="0.8"/>
    <ellipse cx="612" cy="446" rx="70" ry="26" fill="#ffe3ac" opacity="0.18" filter="url(#blur16)"/>
  </g>

  <!-- 站台 -->
  <rect x="0" y="562" width="1200" height="188" fill="url(#platform)"/>
  <rect x="0" y="562" width="1200" height="6" fill="#cbb28d" opacity="0.7"/>
  <rect x="0" y="586" width="1200" height="13" fill="#d3ac55" opacity="0.85"/>
  <g stroke="#1f1f22" stroke-width="1.5" opacity="0.25">
    <line x1="0" y1="640" x2="1200" y2="640"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="180" y1="562" x2="180" y2="750"/>
    <line x1="520" y1="562" x2="520" y2="750"/>
    <line x1="860" y1="562" x2="860" y2="750"/>
  </g>
  <rect x="0" y="600" width="1200" height="40" fill="#f3d4a4" opacity="0.07"/>

  <!-- 提箱子的女人 -->
  <g>
    <ellipse cx="352" cy="648" rx="96" ry="12" fill="#141414" opacity="0.35" filter="url(#blur5)"/>
    <path d="M330 336 a25 25 0 1 1 46 6 q-6 14 -6 22 h-40 q0 -10 -4 -18 a25 25 0 0 1 4 -10 z" fill="#2b2420"/>
    <circle cx="352" cy="330" r="25" fill="#2b2420"/>
    <path d="M338 318 q14 -12 30 0 q-4 -16 -15 -16 q-12 0 -15 16 z" fill="#1c1815"/>
    <path d="M320 372 q32 -14 64 0 l14 214 h-92 z" fill="#3d3029"/>
    <path d="M320 372 q32 -14 64 0 l4 18 q-36 -10 -72 0 z" fill="#544034"/>
    <path d="M328 392 l-6 178" stroke="#2c231e" stroke-width="2" opacity="0.7"/>
    <path d="M384 384 q10 34 6 66" stroke="#2c231e" stroke-width="2" opacity="0.7" fill="none"/>
    <path d="M338 586 l-4 60 h14 l6 -60 z" fill="#241e1a"/>
    <path d="M362 586 l4 60 h14 l2 -60 z" fill="#241e1a"/>
    <path d="M330 644 h22 l3 8 h-28 z" fill="#161210"/>
    <path d="M362 644 h22 l3 8 h-28 z" fill="#161210"/>
    <path d="M318 408 q-14 34 -18 62" stroke="#3d3029" stroke-width="14" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 行李箱 -->
  <g>
    <ellipse cx="266" cy="646" rx="70" ry="10" fill="#141414" opacity="0.35" filter="url(#blur5)"/>
    <path d="M242 528 q24 -18 50 0" fill="none" stroke="#3a2c1f" stroke-width="7"/>
    <rect x="216" y="536" width="102" height="108" rx="8" fill="#4b3928"/>
    <rect x="216" y="536" width="102" height="20" rx="8" fill="#5c4632"/>
    <g stroke="#33251a" stroke-width="5" opacity="0.8">
      <line x1="242" y1="556" x2="242" y2="644"/>
      <line x1="292" y1="556" x2="292" y2="644"/>
    </g>
    <rect x="216" y="588" width="102" height="6" fill="#2e2118"/>
    <circle cx="236" cy="648" r="7" fill="#1b1510"/>
    <circle cx="298" cy="648" r="7" fill="#1b1510"/>
    <rect x="306" y="520" width="12" height="26" rx="4" fill="#3a2c1f"/>
  </g>

  <rect x="0" y="480" width="1200" height="120" fill="#f5d7a6" opacity="0.06" filter="url(#blur16)"/>
  <rect width="1200" height="750" fill="url(#vig)"/>
  <rect width="1200" height="750" filter="url(#grain)" opacity="0.06"/>
</svg>
